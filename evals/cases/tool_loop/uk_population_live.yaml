      allowed_numbers: [2026, 2024, 25, 5]
      number_tolerance: 0.1

  - <<: *common
    id: uk_population_state_pension_2pct_cost
    description: Annual cost of increasing the State Pension by 2%.
    prompt: What would be the annual cost of increasing the State Pension by 2%?
    expected_tools: *budget_tools
    expect:
      required: ["2026", FRS, annual, £]
      forbidden: *neutral_forbidden
