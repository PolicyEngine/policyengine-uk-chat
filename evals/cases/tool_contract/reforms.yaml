cases:
  - id: validate_reform_rejects_unknown_parameter
    suite: tool_contract
    description: validate_reform rejects an unknown policyengine.py parameter path.
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      reform:
        gov.made_up.parameter: 1
    expect:
      contains:
        valid: false
      required_paths:
        - errors.0.path
        - errors.0.message

  - id: validate_reform_rejects_non_object
    suite: tool_contract
    description: validate_reform rejects a reform payload that is not an object.
    tags: [schema_negative]
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      reform: [bad]
    expect:
      contains:
        valid: false
        errors:
          - path: reform

  - id: validate_reform_accepts_scalar_parameter
    suite: tool_contract
    description: validate_reform accepts a canonical flat scalar reform.
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      year: 2026
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
    expect:
      contains:
        valid: true
        normalized_reform:
          gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
      required_paths:
        - reform_object

  - id: validate_reform_accepts_dated_parameter
    suite: tool_contract
    description: validate_reform accepts an explicit date-to-value mapping.
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      year: 2026
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount:
          2026-01-01: 15000
    expect:
      contains:
        valid: true

  - id: validate_reform_strips_null_parameter
    suite: tool_contract
    description: validate_reform strips null-valued parameter paths.
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount:
    expect:
      contains:
        valid: true
        normalized_reform: {}
