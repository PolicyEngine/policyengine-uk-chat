[mypy]
python_version = 3.13
strict = True
pretty = True
show_error_codes = True
warn_unreachable = True

# The strict check currently covers the new analysis application boundary.  Its
# dependencies still include older runtime modules that are checked separately
# by pytest while their annotations are migrated incrementally.
[mypy-engine.*]
ignore_errors = True

[mypy-tools.*]
ignore_errors = True

[mypy-config.*]
ignore_errors = True

[mypy-analysis.binding]
ignore_errors = True

[mypy-analysis.catalogue]
ignore_errors = True

[mypy-analysis.common]
ignore_errors = True

[mypy-analysis.compiler]
ignore_errors = True

[mypy-analysis.executor]
ignore_errors = True

[mypy-analysis.interpreter]
ignore_errors = True

[mypy-analysis.models]
ignore_errors = True

[mypy-analysis.narration]
ignore_errors = True

[mypy-sqlmodel]
ignore_missing_imports = True
