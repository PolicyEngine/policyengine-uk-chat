  - id: uk_2026_cgt_pre_budget_rates
    suite: tool_contract
    description: Rolling CGT rates back to 10 and 20 percent lowers CGT by 1600.
    tags: [uk_2026_golden, reform]
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2026
      people:
        - age: 35
          adjusted_net_income: 20000
          capital_gains: 23000
      benunit: {}
      household:
        country: ENGLAND
      extra_variables:
        - capital_gains_tax
      reform:
        gov.hmrc.cgt.basic_rate: 0.1
        gov.hmrc.cgt.higher_rate: 0.2
        gov.hmrc.cgt.additional_rate: 0.2
    expect:
      numeric:
        - path: baseline.person.0.capital_gains_tax
          equals: 3600.000244140625
          tolerance: 0.05
        - path: reform.person.0.capital_gains_tax
          equals: 2000
          tolerance: 0.05

