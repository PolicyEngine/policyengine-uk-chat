cases:
  - id: uk_2026_single_employee_35000
    suite: tool_contract
    description: A single employee in England has stable 2026 tax, NI, and net income.
    tags: [uk_2026_golden, household]
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2026
      people:
        - age: 35
          employment_income: 35000
      benunit: {}
      household:
        country: ENGLAND
    expect:
      contains:
        status: success
        year: 2026
        reform_applied: false
      numeric:
        - path: person.0.income_tax
          equals: 4486
          tolerance: 0.05
        - path: person.0.national_insurance
          equals: 1794.4029541015625
          tolerance: 0.05
        - path: person.0.ni_employer
          equals: 4501.2001953125
          tolerance: 0.05
        - path: household.household_net_income
          equals: 28539.552734375
          tolerance: 0.05

