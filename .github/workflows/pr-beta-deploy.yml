name: Deploy PR beta preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-beta-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_COMMENT_MARKER: "<!-- pr-beta-preview -->"
  # Modal derives its web-function label from the app name. Keep previews
  # short and stable rather than using branch names that Modal may truncate.
  MODAL_PREVIEW_APP_NAME: pe-uk-chat-${{ github.event.pull_request.number }}
  MODAL_PREVIEW_SECRET_NAME: pe-uk-chat-${{ github.event.pull_request.number }}-secrets

jobs:
  deploy:
    name: Deploy beta preview
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Compute frontend preview URL
        id: names
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: python .github/scripts/preview_frontend_url.py

      - name: Install Modal
        run: pip install modal

      - name: Stop stale backend preview
        env:
          MODAL_APP_NAME: ${{ env.MODAL_PREVIEW_APP_NAME }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: .github/scripts/stop-modal-app.sh

      - name: Seed Modal secret for preview deploy
        env:
          MODAL_SECRET_NAME: ${{ env.MODAL_PREVIEW_SECRET_NAME }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLICYENGINE_UK_DATA_TOKEN: ${{ secrets.POLICYENGINE_UK_DATA_TOKEN }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          DATABASE_URL: ${{ secrets.POLICYENGINE_UK_CHAT_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OBSERVABILITY_GOOGLE_CLOUD_PROJECT: ${{ vars.OBSERVABILITY_GOOGLE_CLOUD_PROJECT || 'policyengine-api' }}
          OBSERVABILITY_GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.OBSERVABILITY_GOOGLE_WORKLOAD_IDENTITY_PROVIDER || 'projects/389282473430/locations/global/workloadIdentityPools/modal/providers/modal' }}
          OBSERVABILITY_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ vars.OBSERVABILITY_GOOGLE_SERVICE_ACCOUNT_EMAIL || 'observability-writer@policyengine-api.iam.gserviceaccount.com' }}
          # Previews are the live test bed for Google Cloud Logging routing.
          OBSERVABILITY_LOG_DESTINATIONS: ${{ vars.OBSERVABILITY_LOG_DESTINATIONS_PREVIEW || 'google_cloud_logging' }}
          OBSERVABILITY_ENVIRONMENT: preview
          HOSTNAMES: ${{ steps.names.outputs.frontend_url }}
          PUBLIC_BASE_URL: ${{ steps.names.outputs.frontend_url }}/uk/chat
        run: .github/scripts/sync-modal-secret.sh

      - name: Deploy backend preview to Modal
        id: modal_deploy
        env:
          MODAL_APP_NAME: ${{ env.MODAL_PREVIEW_APP_NAME }}
          MODAL_SECRET_NAME: ${{ env.MODAL_PREVIEW_SECRET_NAME }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: .github/scripts/deploy-modal-preview.sh

      - name: Smoke test preview backend
        env:
          BACKEND_URL: ${{ steps.modal_deploy.outputs.modal_url }}
          FRONTEND_URL: ${{ steps.names.outputs.frontend_url }}
        run: .github/scripts/smoke-test-modal-backend.sh

      - name: Add deploy summary
        env:
          FRONTEND_URL: ${{ steps.names.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.modal_deploy.outputs.modal_url }}
        run: .github/scripts/write-preview-summary.sh

      - name: Comment preview URLs on PR
        uses: actions/github-script@v9
        env:
          FRONTEND_URL: ${{ steps.names.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.modal_deploy.outputs.modal_url }}
          PREVIEW_COMMENT_MARKER: ${{ env.PREVIEW_COMMENT_MARKER }}
        with:
          script: |
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const body = [
              marker,
              "Beta preview is ready.",
              "",
              `- Frontend: [open preview](${process.env.FRONTEND_URL})`,
              `- Backend: [open backend](${process.env.BACKEND_URL})`,
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup:
    name: Clean up beta preview
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Modal
        run: pip install modal

      - name: Stop Modal preview app and delete preview secret
        env:
          MODAL_APP_NAME: ${{ env.MODAL_PREVIEW_APP_NAME }}
          MODAL_SECRET_NAME: ${{ env.MODAL_PREVIEW_SECRET_NAME }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: .github/scripts/cleanup-modal-preview.sh

      - name: Update PR comment after cleanup
        uses: actions/github-script@v9
        env:
          PREVIEW_COMMENT_MARKER: ${{ env.PREVIEW_COMMENT_MARKER }}
        with:
          script: |
            const marker = process.env.PREVIEW_COMMENT_MARKER;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: [
                  marker,
                  "Beta preview has been cleaned up because this PR was closed.",
                ].join("\n"),
              });
            }
