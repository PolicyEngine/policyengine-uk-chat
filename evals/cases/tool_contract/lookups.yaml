cases:
  - id: get_parameter_personal_allowance_2025
    suite: tool_contract
    description: get_parameter returns the canonical personal allowance value for a year.
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.income_tax.allowances.personal_allowance.amount
      year: 2025
    expect:
      contains:
        status: success
        parameter:
          path: gov.hmrc.income_tax.allowances.personal_allowance.amount
          year: 2025
      numeric:
        - path: parameter.value
          equals: 12570
          tolerance: 0

  - id: get_parameter_basic_rate_threshold_2025
    suite: tool_contract
    description: get_parameter returns the canonical higher-rate starting threshold.
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.income_tax.rates.uk[1].threshold
      year: 2025
    expect:
      contains:
        status: success
        parameter:
          path: gov.hmrc.income_tax.rates.uk[1].threshold
          year: 2025
      numeric:
        - path: parameter.value
          equals: 37700
          tolerance: 0

  - id: get_parameter_standard_rate_vat_2025
    suite: tool_contract
    description: get_parameter returns the canonical standard VAT rate.
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.vat.standard_rate
      year: 2025
    expect:
      contains:
        status: success
        parameter:
          path: gov.hmrc.vat.standard_rate
          year: 2025
      numeric:
        - path: parameter.value
          equals: 0.2
          tolerance: 0

  - id: search_parameters_uc_standard_allowance_variants
    suite: tool_contract
    description: search_parameters discovers the Universal Credit standard allowance variants.
    requirements: [policyengine_py]
    tool_name: search_parameters
    input:
      query: universal credit standard allowance
      limit: 10
    expect:
      contains:
        status: success
        query: universal credit standard allowance
      required_paths:
        - parameters.0.path

  - id: get_parameter_personal_allowance_2026
    suite: tool_contract
    description: get_parameter returns the 2026 personal allowance.
    tags: [uk_2026_golden, parameter]
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.income_tax.allowances.personal_allowance.amount
      year: 2026
    expect:
      contains:
        status: success
        parameter:
          year: 2026
      numeric:
        - path: parameter.value
          equals: 12570

  - id: get_parameter_basic_income_tax_rate_2026
    suite: tool_contract
    description: get_parameter returns the 2026 basic income-tax rate.
    tags: [uk_2026_golden, parameter]
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.income_tax.rates.uk[0].rate
      year: 2026
    expect:
      numeric:
        - path: parameter.value
          equals: 0.2

  - id: get_parameter_employer_ni_rate_2026
    suite: tool_contract
    description: get_parameter returns the 2026 employer NI rate.
    tags: [uk_2026_golden, parameter]
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.national_insurance.class_1.rates.employer
      year: 2026
    expect:
      numeric:
        - path: parameter.value
          equals: 0.15

  - id: get_parameter_employer_ni_threshold_2026
    suite: tool_contract
    description: get_parameter returns the 2026 weekly secondary threshold.
    tags: [uk_2026_golden, parameter]
    requirements: [policyengine_py]
    tool_name: get_parameter
    input:
      path: gov.hmrc.national_insurance.class_1.thresholds.secondary_threshold
      year: 2026
    expect:
      numeric:
        - path: parameter.value
          equals: 96
