  - <<: *common
    id: uk_population_uc_work_allowance_500_cost
    description: Annual cost of increasing the Universal Credit work allowance by £500 per year.
    prompt: What would be the annual cost of increasing both Universal Credit work allowances with and without housing support by £500 per year?
    expected_tools: *budget_tools
    expect:
