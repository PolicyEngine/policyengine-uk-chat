name: Deploy to Modal

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: .github/scripts/install-backend-dependencies.sh

      - name: Run backend tests with coverage
        run: make test-backend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          flags: backend
          name: backend
          use_oidc: true
          verbose: true

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/lcov.info
          fail_ci_if_error: false
          flags: frontend
          name: frontend
          use_oidc: true
          verbose: true

  deploy:
    name: Deploy to Modal
    needs:
      - test
      - frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Modal
        run: pip install modal

      - name: Sync secrets to Modal
        env:
          MODAL_SECRET_NAME: policyengine-uk-chat-secrets
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GATEWAY_PROPOSAL_SIGNING_KEY: ${{ secrets.GATEWAY_PROPOSAL_SIGNING_KEY }}
          UK_CHAT_EVAL_TOKEN: ${{ secrets.UK_CHAT_EVAL_TOKEN }}
          POLICYENGINE_UK_DATA_TOKEN: ${{ secrets.POLICYENGINE_UK_DATA_TOKEN }}
          # TEMPORARY: data access for the policyengine.py engine override.
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
          DATABASE_URL: ${{ secrets.POLICYENGINE_UK_CHAT_DATABASE_URL }}
          BILLING_ENABLED: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OBSERVABILITY_GOOGLE_CLOUD_PROJECT: ${{ vars.OBSERVABILITY_GOOGLE_CLOUD_PROJECT || 'policyengine-api' }}
          OBSERVABILITY_GOOGLE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.OBSERVABILITY_GOOGLE_WORKLOAD_IDENTITY_PROVIDER || 'projects/389282473430/locations/global/workloadIdentityPools/modal/providers/modal' }}
          OBSERVABILITY_GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ vars.OBSERVABILITY_GOOGLE_SERVICE_ACCOUNT_EMAIL || 'observability-writer@policyengine-api.iam.gserviceaccount.com' }}
          # Production stays on stdout until Google Cloud Logging is verified
          # on previews; flip by setting the repo variable — no code change.
          OBSERVABILITY_LOG_DESTINATIONS: ${{ vars.OBSERVABILITY_LOG_DESTINATIONS_PRODUCTION || 'stdout' }}
          OBSERVABILITY_ENVIRONMENT: production
          HOSTNAMES: https://policyengine-uk-chat.vercel.app,https://policyengine-uk-chat-bmxyy36r1-policy-engine.vercel.app
          PUBLIC_BASE_URL: https://policyengine-uk-chat.vercel.app/uk/chat
        run: .github/scripts/sync-modal-secret.sh

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy modal_app.py

      # A deploy that leaves the backend unable to serve requests must turn
      # this run red instead of failing silently (see the #142 outage, where
      # the first log write hung every request in the new containers).
      - name: Smoke test deployed backend
        env:
          BACKEND_URL: https://policyengine--policyengine-uk-chat-web.modal.run
        run: .github/scripts/smoke-test-modal-backend.sh
