      allowed_numbers: [2026, 2024, 25, 2]
      number_tolerance: 0.1

  - <<: *common
    id: uk_population_uc_taper_minus_2pp_deciles
    description: Decile impacts from reducing the Universal Credit taper rate by two percentage points.
    prompt: How would reducing the Universal Credit taper rate by two percentage points affect household incomes by decile?
    expected_tools: *decile_tools
