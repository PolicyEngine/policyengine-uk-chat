      allowed_numbers: [2026, 2024, 25, 500]
      number_tolerance: 0.1

  - <<: *common
    id: uk_population_uc_work_allowance_500_households
    description: Household gains from increasing the Universal Credit work allowance by £500 per year.
    prompt: How many households would gain from increasing both Universal Credit work allowances with and without housing support by £500 per year?
    expected_tools: *winners_tools
    expect:
      required: ["2026", FRS, households, gain]
      forbidden: *neutral_forbidden
      grounded_numbers: true
      allowed_numbers: [2026, 2024, 25, 500, 5]
      number_tolerance: 0.1

  - <<: *common
    id: uk_population_uc_taper_minus_2pp_cost
    description: Annual cost of reducing the Universal Credit taper rate by two percentage points.
    prompt: What would be the annual cost of reducing the Universal Credit taper rate by two percentage points?
