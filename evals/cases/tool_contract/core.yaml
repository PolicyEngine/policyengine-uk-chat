cases:
  - id: chart_contract_line
    suite: tool_contract
    description: generate_chart returns frontend-renderable chart markdown.
    tool_name: generate_chart
    input:
      chart_kind: generic_line
      title: Baseline and reform net income
      data:
        - income: 0
          baseline: 0
          reform: 0
        - income: 30000
          baseline: 25000
          reform: 25200
      x_field: income
      y_fields: [baseline, reform]
      x_format: currency
      y_format: currency
    expect:
      contains:
        status: success
      required_paths:
        - chart_markdown

  - id: list_datasets_marks_enhanced_frs_restricted
    suite: tool_contract
    description: Dataset discovery identifies Enhanced FRS as aggregate-only.
    tool_name: list_datasets
    input: {}
    expect:
      contains:
        status: success
      required_paths:
        - datasets.0.name
        - datasets.0.row_level_access

  - id: validate_reform_accepts_personal_allowance
    suite: tool_contract
    description: validate_reform accepts a valid parametric reform.
    requirements: [policyengine_py]
    tool_name: validate_reform
    input:
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
    expect:
      contains:
        valid: true
        normalized_reform:
          gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000

  - id: run_household_simulation_single_adult
    suite: tool_contract
    description: run_household_simulation returns a policyengine.py household result.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 30000
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
        year: 2025
        reform_applied: false
      required_paths:
        - person.0.income_tax
        - person.0.national_insurance
        - benunit.universal_credit
        - household.household_net_income
      absent_paths:
        - baseline
        - reform

  - id: run_household_simulation_empty_reform_is_noop
    suite: tool_contract
    description: run_household_simulation normalizes an empty reform to no reform.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      reform: {}
      people:
        - age: 35
          employment_income: 30000
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
        reform_applied: false
      required_paths:
        - person.0.income_tax
        - household.household_net_income
      absent_paths:
        - baseline
        - reform

  - id: run_axes_simulation_returns_handle_not_series
    suite: tool_contract
    description: run_axes_simulation retains selected series behind a turn-local handle.
    requirements: [policyengine_py]
    tool_name: run_axes_simulation
    input:
      year: 2026
      people:
        - age: 30
      benunit: {}
      household: {}
      axis:
        name: employment_income
        min: 0
        max: 100000
        count: 3
      outputs: [household_net_income]
    expect:
      contains:
        status: success
        year: 2026
        point_count: 3
        targets: [baseline]
        axis:
          name: employment_income
          index: 0
          count: 3
      required_paths:
        - simulation_id
        - outputs.0.name
      absent_paths:
        - household_input
        - x
        - y

  - id: economy_simulation_smoke
    suite: tool_contract
    description: run_society_simulation returns metadata and a derivative handle.
    requirements: [policyengine_py, data]
    tool_name: run_society_simulation
    input:
      year: 2026
      dataset: enhanced_frs_2024_25
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
    expect:
      contains:
        status: success
        year: 2026
        reform_applied: true
      required_paths:
        - result_id
        - dataset.name
      absent_paths:
        - budgetary_impact
        - decile_impacts
        - winners_losers
