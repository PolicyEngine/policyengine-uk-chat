    expect:
      candidate_contains: {kind: start_analysis}
      reduced_revision_contains: {fields: {analysis_kind: {value: exploratory}}}
      binding_outcome: ready
      plan_contains: {mode: exploratory, max_operation_calls: 6}
      permitted_operations: [compute_budgetary_impact]
      response_outcome: operation_rejected
      error_code: operation_not_permitted

  - id: turn_reject_unsupported_narrator_number
    suite: turn_interpretation
    description: Narration free text cannot introduce a number absent from the fact register.
    prompt: Run a 2026 society simulation and show the budgetary impact.
    turn_id: turn-narrator-number
    initial_state: *idle
    offline_candidate:
      kind: start_analysis
      relationship: new
      candidate:
        analysis_kind: {value: society, evidence: {quote: society simulation}}
        fields:
          year: {value: 2026, evidence: {quote: "2026"}}
        outputs: [budgetary_impact]
        output_evidence: {quote: budgetary impact}
    adversarial_narration_draft:
      segments:
        - {type: text, text: "The result is £999."}
