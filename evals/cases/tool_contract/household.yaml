  - id: household_reform_changes_reform_fields_only
    suite: tool_contract
    description: calculate_household returns baseline and reform fields for a parametric reform.
    requirements: [compiled]
    tool_name: calculate_household
    input:
      year: 2025
      reform:
        income_tax:
          personal_allowance: 15000
      person:
        - person_id: 0
          benunit_id: 0
          household_id: 0
          age: 35
          employment_income: 30000
      benunit:
        - benunit_id: 0
          household_id: 0
      household:
        - household_id: 0
    expect:
      contains:
        status: success
        reform_applied: true
      numeric:
        - path: person.0.baseline_income_tax
          equals: 3486
          tolerance: 1
        - path: person.0.baseline_employee_ni
          equals: 1394.4
          tolerance: 1
        - path: person.0.reform_income_tax
          equals: 2994.2
          tolerance: 1
        - path: person.0.reform_employee_ni
          equals: 1392.08
          tolerance: 1
        - path: household.0.baseline_net_income
          equals: 25119.6
          tolerance: 1
        - path: household.0.baseline_total_tax
          equals: 6936.89
          tolerance: 1
        - path: household.0.reform_net_income
          equals: 25584.7
          tolerance: 1
        - path: household.0.reform_total_tax
          equals: 6477.24
          tolerance: 1

