cases:
  - id: economy_simulation_invalid_reform_errors_before_data
    suite: tool_contract
    description: run_society_simulation returns a structured error for invalid reform JSON before loading data.
    requirements: [policyengine_py]
    tool_name: run_society_simulation
    input:
      year: 2026
      dataset: enhanced_frs_2023_24
      reform:
        gov.made_up.parameter: 1
    expect:
      error_contains: gov.made_up.parameter

  - id: economy_simulation_baseline_aggregate_shape
    suite: tool_contract
    description: run_society_simulation baseline run returns metadata and a simulation handle only.
    requirements: [policyengine_py, data]
    tool_name: run_society_simulation
    input:
      year: 2026
      dataset: enhanced_frs_2023_24
    expect:
      contains:
        status: success
        year: 2026
        reform_applied: false
      required_paths:
        - result_id
        - dataset.name
      absent_paths:
        - budgetary_impact
        - program_breakdown_changes
        - decile_impacts
        - winners_losers

  - id: economy_simulation_personal_allowance_aggregate_shape
    suite: tool_contract
    description: run_society_simulation reform run defers all derivative outputs.
    requirements: [policyengine_py, data]
    tool_name: run_society_simulation
    input:
      year: 2026
      dataset: enhanced_frs_2023_24
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
    expect:
      contains:
        status: success
        year: 2026
        reform_applied: true
      required_paths:
        - result_id
        - dataset.name
      absent_paths:
        - budgetary_impact
        - program_breakdown_changes
        - decile_impacts
        - winners_losers
