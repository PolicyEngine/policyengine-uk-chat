  - id: uk_2026_single_parent_two_children
    suite: tool_contract
    description: A single parent exercises 2026 tax, NI, Child Benefit, and Universal Credit.
    tags: [uk_2026_golden, household, benefits]
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2026
      people:
        - age: 35
          employment_income: 22000
        - age: 4
        - age: 9
      benunit:
        would_claim_child_benefit: true
        would_claim_uc: true
      household:
        country: ENGLAND
    expect:
