name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      model_facing: ${{ steps.filter.outputs.model_facing }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect model-facing changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            model_facing:
              - "backend/chat/**"
              - "backend/config/**"
              - "backend/engine/**"
              - "backend/eval/**"
              - "backend/gateway/**"
              - "backend/prompts/**"
              - "backend/requirements*.txt"
              - "backend/tools/**"
              - "evals/**"
              - "Makefile"
              - "modal_app.py"
              - ".github/workflows/tests.yml"

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run backend tests with coverage
        run: make test-backend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          flags: backend
          name: backend
          use_oidc: true
          verbose: true

  deterministic-evals:
    name: Deterministic eval — ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PolicyEngine tool contracts
            target: eval-tool-contracts
          - label: scripted trajectories
            target: eval-scripted-trajectories
          - label: scripted answers
            target: eval-scripted-answers
          - label: scripted tool loops
            target: eval-scripted-tool-loops

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run ${{ matrix.label }}
        run: make ${{ matrix.target }}

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/lcov.info
          fail_ci_if_error: false
          flags: frontend
          name: frontend
          use_oidc: true
          verbose: true

  enhanced-frs:
    name: Configured Enhanced FRS integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      RUN_DATA_EVALS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Require the Enhanced FRS credential
        run: |
          if [ -z "$HUGGING_FACE_TOKEN" ]; then
            echo "::error::HUGGING_FACE_TOKEN is required for Enhanced FRS integration."
            exit 1
          fi

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run the 2026 Enhanced FRS lifecycle
        run: |
          PYTHONPATH=backend python -m pytest \
            backend/tests/test_data_integration.py -v

  live-model-evals:
    name: Live ${{ matrix.label }} evals (3 trials)
    needs: changes
    if: needs.changes.outputs.model_facing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gateway
            target: eval-ai-live-gateway
            requires_data: false
          - label: trajectory
            target: eval-ai-live-trajectory
            requires_data: false
          - label: answer
            target: eval-ai-live-answer
            requires_data: false
          - label: tool-loop
            target: eval-ai-live-tool-loop
            requires_data: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HUGGING_FACE_TOKEN: ${{ matrix.requires_data && secrets.HUGGING_FACE_TOKEN || '' }}
      HF_TOKEN: ${{ matrix.requires_data && secrets.HUGGING_FACE_TOKEN || '' }}
      RUN_DATA_EVALS: ${{ matrix.requires_data && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Require the live-model credential
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is required for model-facing pull requests."
            exit 1
          fi

      - name: Require the Enhanced FRS credential for data-backed live cases
        if: matrix.requires_data
        run: |
          if [ -z "$HUGGING_FACE_TOKEN" ]; then
            echo "::error::HUGGING_FACE_TOKEN is required for data-backed live evals."
            exit 1
          fi

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run live ${{ matrix.label }} cases three times
        run: make ${{ matrix.target }}

      - name: Upload live eval reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-${{ matrix.label }}-eval-report
          path: evals/reports/
          if-no-files-found: warn
