- id: policyengine_uk_council_tax_rebate_bands
  suite: tool_contract
  description: 'Imported from policyengine-uk: tests/policy/baseline/gov/treasury/energy_bills_rebate/council_tax_rebate.yaml
    :: CT bands A-D get full rebate, others don''t.'
  tags:
  - policyengine_uk
  - source_synced
  requirements:
  - policyengine_py
  source:
    package: policyengine-uk
    version: 2.89.2
    path: tests/policy/baseline/gov/treasury/energy_bills_rebate/council_tax_rebate.yaml
    name: CT bands A-D get full rebate, others don't.
  tool_name: run_household_simulation
  input:
    year: 2023
    people:
    - {}
    benunit: {}
    household:
      council_tax:
      - 150
      - 150
      - 150
      - 150
      - 150
      - 150
      - 150
      - 150
      - 150
      council_tax_band:
      - A
      - B
      - C
      - D
      - E
      - F
      - G
      - H
      - I
  skip:
    code: policyengine_py_coverage_gap
    reason: The source case supplies categorical vector inputs, while policyengine.py
      household axes currently support numeric ranges only.
    remove_when: policyengine.py household simulations support categorical vector
      axes.
