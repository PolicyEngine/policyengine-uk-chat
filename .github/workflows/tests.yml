name: Tests

on:
  pull_request:
    branches:
      - main

# A new push to a pull request supersedes the run on its previous head, so
# cancel that run instead of letting it wait for, then hold, runners the whole
# PolicyEngine org shares (60 concurrent jobs on the GitHub Team plan).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    # Slowest of 12 successful runs, 2026-09-01..10-08: 4.1 minutes. Fail a hung
    # job instead of holding a shared runner for GitHub's 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: capability_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capability_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAPABILITY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/capability_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: .github/scripts/install-backend-dependencies.sh

      - name: Run backend tests with coverage
        run: make test-backend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          flags: backend
          name: backend
          use_oidc: true
          verbose: true

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/lcov.info
          fail_ci_if_error: false
          flags: frontend
          name: frontend
          use_oidc: true
          verbose: true
