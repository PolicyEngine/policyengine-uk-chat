cases:
  - id: generic_chart_replaces_python_plotting
    suite: tool_contract
    description: Generic chart generation accepts typed data without executing Python.
    tool_name: generate_chart
    input:
      chart_kind: generic_line
      data:
        - earnings: 0
          value: 0
        - earnings: 30000
          value: 250
      x_field: earnings
      y_fields: [value]
      x_format: currency
      y_format: currency
    expect:
      contains:
        status: success
      chart_contains:
        type: line
        x:
          field: earnings
        y:
          field: value

  - id: preset_chart_requires_typed_derivative
    suite: tool_contract
    description: Society preset charts cannot accept model-invented aggregate data.
    tool_name: generate_chart
    input:
      chart_kind: budget_waterfall
    expect:
      error_contains: requires a result_id

  - id: earnings_chart_accepts_explicit_set_pieces
    suite: tool_contract
    description: Earnings variation remains a deterministic preset over explicit synthetic points.
    tool_name: generate_chart
    input:
      chart_kind: earnings_variation_line
      data:
        - earnings: 0
          value: 0
        - earnings: 30000
          value: 250
    expect:
      contains:
        status: success
      chart_contains:
        type: preset
        preset: earnings_variation_line
