      allowed_numbers: [2026, 2024, 25, 2]
      number_tolerance: 0.1

  - <<: *common
    id: uk_population_personal_allowance_500_deciles
    description: Decile impacts from increasing the personal allowance by £500.
    prompt: How would increasing the personal allowance by £500 affect household incomes by decile?
    expected_tools: *decile_tools
