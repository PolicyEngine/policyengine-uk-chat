cases:
  - id: society_outputs_are_aggregate_only
    suite: tool_contract
    description: Supported-output discovery exposes simulation handles and aggregate derivatives, not rows.
    tool_name: list_supported_outputs
    input:
      scope: society
    expect:
      contains:
        status: success
        scope: society
      required_paths:
        - outputs.0.name

  - id: derivative_outputs_are_catalogued
    suite: tool_contract
    description: Supported-output discovery lists policyengine.py derivative outputs.
    tool_name: list_supported_outputs
    input:
      scope: derivative
    expect:
      contains:
        status: success
        scope: derivative
      required_paths:
        - outputs.0.name
