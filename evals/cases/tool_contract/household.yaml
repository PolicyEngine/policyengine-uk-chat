cases:
  - id: household_couple_one_earner
    suite: tool_contract
    description: run_household_simulation handles a couple in one UK benefit unit.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 38000
        - age: 35
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
        year: 2025
        reform_applied: false
      required_paths:
        - person.0.employment_income
        - person.0.income_tax
        - person.0.national_insurance
        - person.1.income_tax
        - benunit.child_benefit
        - household.household_net_income
        - household.household_tax

  - id: household_single_parent_two_children
    suite: tool_contract
    description: run_household_simulation handles one adult and two children in one benefit unit.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 22000
        - age: 4
        - age: 9
      benunit:
        would_claim_child_benefit: true
        would_claim_uc: true
      household: {}
    expect:
      contains:
        status: success
      required_paths:
        - person.2.age
        - benunit.child_benefit
        - benunit.universal_credit
        - household.household_benefits
        - household.household_net_income

  - id: household_scotland_location
    suite: tool_contract
    description: run_household_simulation accepts UK region inputs and returns Scottish-tax results.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 50000
      benunit: {}
      household:
        region: SCOTLAND
    expect:
      contains:
        status: success
      required_paths:
        - person.0.income_tax
        - person.0.national_insurance
        - household.household_net_income
      numeric:
        - path: person[].income_tax
          equals: 9013.8
          tolerance: 1

  - id: household_mixed_employment_self_employment
    suite: tool_contract
    description: run_household_simulation handles employment and self-employment income together.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 18000
          self_employment_income: 12000
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
      required_paths:
        - person.0.employment_income
        - person.0.self_employment_income
        - person.0.total_income
        - person.0.income_tax
        - person.0.national_insurance
        - household.household_net_income

  - id: household_reform_returns_baseline_and_reform
    suite: tool_contract
    description: run_household_simulation returns separate policyengine.py results for a reform.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
      people:
        - age: 35
          employment_income: 30000
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
        reform_applied: true
      required_paths:
        - baseline.person.0.income_tax
        - baseline.person.0.national_insurance
        - baseline.household.household_net_income
        - reform.person.0.income_tax
        - reform.person.0.national_insurance
        - reform.household.household_net_income
      absent_paths:
        - person.0.income_tax
        - household.household_net_income

  - id: household_invalid_entity_variable_errors
    suite: tool_contract
    description: validate_household rejects a variable supplied on the wrong entity.
    requirements: [policyengine_py]
    tool_name: validate_household
    input:
      year: 2025
      people:
        - age: 35
          household_net_income: 10000
      benunit: {}
      household: {}
    expect:
      contains:
        valid: false
      required_paths:
        - errors.0.message

  - id: household_invalid_ons_country_code
    suite: tool_contract
    description: validate_household rejects ONS geography codes in the categorical country field.
    tags: [schema_negative]
    tool_name: validate_household
    input:
      year: 2025
      people:
        - age: 35
      benunit: {}
      household:
        country: E92000001
    expect:
      contains:
        valid: false
        errors:
          - path: household.country
      required_paths:
        - errors.0.message

  - id: household_england_country_id
    suite: tool_contract
    description: run_household_simulation accepts the exact categorical England country ID.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2025
      people:
        - age: 35
          employment_income: 30000
      benunit: {}
      household:
        country: ENGLAND
    expect:
      contains:
        status: success
      required_paths:
        - person.0.income_tax
        - household.household_net_income

  - id: household_omits_population_ranked_variables
    suite: tool_contract
    description: >
      Illustrative household results omit deciles and relative poverty, which
      rank one household against itself, and explain the omission instead.
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2026
      people:
        - age: 40
          employment_income: 6000
      benunit: {}
      household: {}
    expect:
      contains:
        status: success
      required_paths:
        - household.household_net_income
        - household.in_poverty_bhc
        - omitted_population_ranked_variables.household_income_decile
        - omitted_population_ranked_variables.household_wealth_decile
        - omitted_population_ranked_variables.in_relative_poverty_bhc
        - omitted_population_ranked_variables.in_relative_poverty_ahc
      absent_paths:
        - household.household_income_decile
        - household.household_wealth_decile
        - household.in_relative_poverty_bhc
        - household.in_relative_poverty_ahc
