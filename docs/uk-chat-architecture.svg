<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">PolicyEngine UK chat application architecture</title>
  <desc id="desc">Diagram showing frontend, backend, LLM, tool execution, PolicyEngine compiled package, and deterministic versus non-deterministic boundaries.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 34px; font-weight: 740; fill: #0f172a; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; fill: #475569; }
      .stage-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 760; fill: #111827; }
      .label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #334155; }
      .small { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #334155; }
      .box { stroke-width: 1.4; rx: 12; filter: url(#shadow); }
      .frontend { fill: #fff7ed; stroke: #fb923c; }
      .backend { fill: #eff6ff; stroke: #3b82f6; }
      .llm { fill: #f5f3ff; stroke: #8b5cf6; }
      .engine { fill: #f0fdf4; stroke: #22c55e; }
      .tool { fill: #ecfeff; stroke: #06b6d4; }
      .storage { fill: #fefce8; stroke: #eab308; }
      .boundary { fill: none; stroke: #ef4444; stroke-width: 2; stroke-dasharray: 8 7; rx: 16; }
      .boundary-label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 720; fill: #991b1b; }
      .arrow { stroke: #4b5563; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-purple { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); }
      .arrow-green { stroke: #15803d; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .dash-arrow { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
      .legend-box { stroke-width: 1.2; rx: 8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1320"/>

  <text class="title" x="60" y="58">PolicyEngine UK Chat: AI Pathway And Execution Boundaries</text>
  <text class="subtitle" x="60" y="86">The LLM interprets and writes tool inputs. Python executes those inputs. The compiled PolicyEngine package performs the model calculation.</text>

  <g transform="translate(1260 42)">
    <rect class="legend-box frontend" x="0" y="0" width="22" height="16"/>
    <text class="small" x="30" y="13">Frontend / rendering</text>
    <rect class="legend-box backend" x="180" y="0" width="22" height="16"/>
    <text class="small" x="210" y="13">Deterministic backend</text>
    <rect class="legend-box llm" x="0" y="26" width="22" height="16"/>
    <text class="small" x="30" y="39">LLM / non-deterministic</text>
    <rect class="legend-box engine" x="180" y="26" width="22" height="16"/>
    <text class="small" x="210" y="39">Compiled engine</text>
  </g>

  <!-- Top-level orchestration path -->
  <rect class="box frontend" x="60" y="130" width="360" height="185"/>
  <text class="stage-title" x="85" y="164">1. Browser UI</text>
  <text class="label" x="85" y="196">
    <tspan x="85" dy="0">User enters text or attaches an image</tspan>
    <tspan x="85" dy="23">Plan mode and charts mode toggles</tspan>
    <tspan x="85" dy="23">Builds conversation messages</tspan>
    <tspan x="85" dy="23">POSTs to backend, reads SSE stream</tspan>
  </text>
  <text class="code" x="85" y="292">frontend/src/app/ChatPage.tsx</text>

  <rect class="box backend" x="495" y="130" width="370" height="185"/>
  <text class="stage-title" x="520" y="164">2. FastAPI Request Prep</text>
  <text class="label" x="520" y="196">
    <tspan x="520" dy="0">/chat/message receives ChatRequest</tspan>
    <tspan x="520" dy="23">Rate limit and billing check</tspan>
    <tspan x="520" dy="23">Deduplicate same-role messages</tspan>
    <tspan x="520" dy="23">Wrap image into Anthropic blocks</tspan>
  </text>
  <text class="code" x="520" y="292">backend/routes/chatbot.py</text>

  <rect class="box llm" x="940" y="115" width="395" height="215"/>
  <text class="stage-title" x="965" y="149">3. Anthropic Model Turn</text>
  <text class="label" x="965" y="181">
    <tspan x="965" dy="0">System prompt plus generated API reference</tspan>
    <tspan x="965" dy="23">Chooses direct answer or tool_use</tspan>
    <tspan x="965" dy="23">Writes Python code for calculations</tspan>
    <tspan x="965" dy="23">Writes final prose after tools return</tspan>
  </text>
  <text class="small" x="965" y="294">Non-deterministic: interpretation, planning, code generation, prose.</text>

  <rect class="box backend" x="1405" y="130" width="335" height="185"/>
  <text class="stage-title" x="1430" y="164">4. SSE Orchestrator</text>
  <text class="label" x="1430" y="196">
    <tspan x="1430" dy="0">Streams chunk/tool_start/tool_use</tspan>
    <tspan x="1430" dy="23">Runs tool calls when emitted</tspan>
    <tspan x="1430" dy="23">Feeds tool results back to model</tspan>
    <tspan x="1430" dy="23">Emits final done event and usage</tspan>
  </text>
  <text class="small" x="1430" y="292">Loop max: 60 iterations</text>

  <path class="arrow" d="M420 222 L495 222"/>
  <text class="boundary-label" x="438" y="207">HTTP request</text>
  <path class="arrow-purple" d="M865 222 L940 222"/>
  <text class="boundary-label" x="884" y="207">LLM call</text>
  <path class="arrow" d="M1335 222 L1405 222"/>
  <text class="boundary-label" x="1348" y="207">stream API</text>

  <rect class="boundary" x="925" y="100" width="425" height="245"/>
  <text class="boundary-label" x="960" y="111">NON-DETERMINISTIC SEGMENT</text>

  <!-- Tool execution path -->
  <rect class="box tool" x="940" y="405" width="395" height="205"/>
  <text class="stage-title" x="965" y="439">5. Tool Dispatcher</text>
  <text class="label" x="965" y="471">
    <tspan x="965" dy="0">Executes only known tool names</tspan>
    <tspan x="965" dy="23">Runs tool calls in thread executor</tspan>
    <tspan x="965" dy="23">Serialises and truncates results</tspan>
    <tspan x="965" dy="23">Sends tool_result back to model</tspan>
  </text>
  <text class="code" x="965" y="574">execute_tool: run_python, generate_chart</text>

  <path class="arrow" d="M1138 330 L1138 405"/>
  <text class="boundary-label" x="1150" y="373">JSON tool schema seam</text>
  <path class="dash-arrow" d="M1340 505 C1435 505 1455 395 1405 290"/>
  <text class="small" x="1370" y="502">tool result becomes model context</text>

  <rect class="box backend" x="495" y="700" width="370" height="250"/>
  <text class="stage-title" x="520" y="734">6A. run_python Tool</text>
  <text class="label" x="520" y="766">
    <tspan x="520" dy="0">Restricted exec environment</tspan>
    <tspan x="520" dy="23">Allows pandas, numpy, json, math</tspan>
    <tspan x="520" dy="23">Preloads PolicyEngine compiled API</tspan>
    <tspan x="520" dy="23">Captures print output</tspan>
    <tspan x="520" dy="23">Requires final value in result</tspan>
  </text>
  <text class="code" x="520" y="905">Simulation, Parameters, StructuralReform</text>
  <text class="code" x="520" y="927">aggregate_microdata, combine_microdata</text>

  <rect class="box engine" x="60" y="700" width="360" height="250"/>
  <text class="stage-title" x="85" y="734">6B. policyengine_uk_compiled</text>
  <text class="label" x="85" y="766">
    <tspan x="85" dy="0">Compiled PolicyEngine interface</tspan>
    <tspan x="85" dy="23">Creates Simulation objects</tspan>
    <tspan x="85" dy="23">Validates Parameters models</tspan>
    <tspan x="85" dy="23">Runs baseline/reform calculations</tspan>
    <tspan x="85" dy="23">Returns Python objects and DataFrames</tspan>
  </text>
  <text class="code" x="85" y="905">sim.run()</text>
  <text class="code" x="85" y="927">sim.run_microdata(...)</text>

  <path class="arrow" d="M940 510 C850 510 815 635 735 700"/>
  <text class="small" x="738" y="625">tool_use: run_python</text>
  <path class="arrow-green" d="M495 825 L420 825"/>
  <text class="boundary-label" x="427" y="808">Python to compiled package</text>
  <path class="dash-arrow" d="M420 870 L495 870"/>
  <text class="small" x="432" y="894">DataFrames / model outputs back to Python</text>

  <rect class="boundary" x="45" y="685" width="835" height="280"/>
  <text class="boundary-label" x="80" y="696">DETERMINISTIC EXECUTION SEGMENT</text>

  <rect class="box storage" x="940" y="700" width="395" height="250"/>
  <text class="stage-title" x="965" y="734">6C. generate_chart Tool</text>
  <text class="label" x="965" y="766">
    <tspan x="965" dy="0">Takes already-computed row data</tspan>
    <tspan x="965" dy="23">Builds chart JSON spec</tspan>
    <tspan x="965" dy="23">Returns fenced chart markdown</tspan>
    <tspan x="965" dy="23">Frontend parses and renders charts</tspan>
  </text>
  <text class="code" x="965" y="905">line, bar, area, scatter</text>
  <path class="arrow" d="M1138 610 L1138 700"/>
  <text class="small" x="1150" y="663">tool_use: generate_chart</text>

  <rect class="box frontend" x="1405" y="700" width="335" height="250"/>
  <text class="stage-title" x="1430" y="734">7. Frontend Rendering</text>
  <text class="label" x="1430" y="766">
    <tspan x="1430" dy="0">Renders Markdown answer</tspan>
    <tspan x="1430" dy="23">Shows tool work in collapsible block</tspan>
    <tspan x="1430" dy="23">Parses ```chart JSON blocks</tspan>
    <tspan x="1430" dy="23">Saves conversation and title</tspan>
    <tspan x="1430" dy="23">Supports share/report/export</tspan>
  </text>
  <path class="arrow" d="M1573 315 L1573 700"/>
  <text class="boundary-label" x="1588" y="511">SSE render seam</text>
  <path class="dash-arrow" d="M1335 825 L1405 825"/>
  <text class="small" x="1348" y="850">chart markdown in final answer</text>

  <!-- Prompt and reference generation -->
  <rect class="box backend" x="60" y="405" width="360" height="205"/>
  <text class="stage-title" x="85" y="439">Prompt Context At Deploy</text>
  <text class="label" x="85" y="471">
    <tspan x="85" dy="0">Builds reference.md from installed package</tspan>
    <tspan x="85" dy="23">Includes capabilities snapshot</tspan>
    <tspan x="85" dy="23">Includes public API signatures</tspan>
    <tspan x="85" dy="23">Includes Parameters JSON schema</tspan>
  </text>
  <text class="code" x="85" y="574">backend/scripts/build_reference.py</text>

  <rect class="box backend" x="495" y="405" width="370" height="205"/>
  <text class="stage-title" x="520" y="439">System Blocks Per Turn</text>
  <text class="label" x="520" y="471">
    <tspan x="520" dy="0">Base policy analysis instructions</tspan>
    <tspan x="520" dy="23">Cached generated reference.md</tspan>
    <tspan x="520" dy="23">Optional plan mode directive</tspan>
    <tspan x="520" dy="23">Optional charts mode directive</tspan>
  </text>
  <text class="small" x="520" y="574">Plan mode: tools omitted entirely.</text>

  <path class="arrow" d="M420 507 L495 507"/>
  <path class="arrow-purple" d="M865 507 C900 507 920 340 980 315"/>

  <!-- Non-exposed helpers -->
  <rect class="box backend" x="60" y="1030" width="1680" height="205"/>
  <text class="stage-title" x="85" y="1064">Helpers Present In agent_tools.py But Not Exposed As Model Tools</text>
  <text class="label" x="85" y="1098">
    <tspan x="85" dy="0">get_capabilities(), get_baseline_parameters(), calculate_household(), run_economy_simulation(), analyse_microdata(), explore_tabular_data()</tspan>
    <tspan x="85" dy="27">These wrappers can be useful deterministic APIs, but the current live TOOL_DEFINITIONS expose only run_python and generate_chart.</tspan>
    <tspan x="85" dy="27">Some equivalent capabilities remain reachable inside run_python through capabilities(), Simulation, Parameters, sim.run(), and sim.run_microdata().</tspan>
    <tspan x="85" dy="27">Private plumbing also exists for policy construction, structural hooks, caching, JSON-safe serialisation, and generator inputs.</tspan>
  </text>

  <!-- Bottom seam summary -->
  <text class="stage-title" x="60" y="1285">Main seam to watch: model-generated code crosses into deterministic run_python; run_python crosses into policyengine_uk_compiled for the actual calculation.</text>
</svg>
