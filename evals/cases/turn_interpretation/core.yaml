    offline_candidate:
      kind: ask_about_execution
      execution_id: execution-foreign
      question: Which dataset did that execution use?
      evidence: {quote: "Which dataset did that execution use?"}
    expect:
      permitted_operations: []
      response_outcome: candidate_rejected
      error_code: state_precondition_failed

  - id: turn_concurrent_change_rejects_stale_base
    suite: turn_interpretation
    description: A candidate based on pre-conflict state is rejected after state reload.
    prompt: Add poverty impact.
    turn_id: turn-conflict
    initial_state: *completed
    active_revision: *society_revision
    offline_candidate:
      kind: revise_analysis
      base_revision_id: rev-before-concurrent-change
      relationship: additional_output
      outputs:
        op: add
        outputs: [poverty_impact]
        evidence: {quote: poverty impact}
    expect:
      permitted_operations: []
      response_outcome: candidate_rejected
      error_code: state_precondition_failed

  - id: turn_exploratory_plan_limits_operations
    suite: turn_interpretation
    description: Exploratory work exposes only compiler-approved operations and limits.
    prompt: Explore the budget impact by programme using at most two analytical calls.
    turn_id: turn-explore
    initial_state: *idle
    offline_candidate:
      kind: start_analysis
      relationship: new
      candidate:
        analysis_kind: {value: exploratory, evidence: {quote: Explore}}
        fields:
          objective:
            value: Compare budget impact by programme
            evidence: {quote: budget impact by programme}
        outputs: [budgetary_impact, program_breakdown]
        output_evidence: {quote: budget impact}
    expect:
      candidate_contains: {kind: start_analysis}
      reduced_revision_contains:
        fields: {analysis_kind: {value: exploratory}}
      binding_outcome: ready
      plan_contains:
        mode: exploratory
        max_model_iterations: 4
        max_operation_calls: 6
        required_result_types: [budgetary_impact, program_breakdown]
      permitted_operations: [compute_budgetary_impact, compute_program_breakdown]
      lifecycle_outcome: plan_ready
      public_outcome_category: completed
      response_outcome: ready_exploratory

  - id: turn_reject_unproducible_exploratory_result
    suite: turn_interpretation
    description: Exploratory compilation rejects an operation set that cannot produce a requested result.
    prompt: Explore the budgetary impact using only a programme breakdown.
    turn_id: turn-unproducible-exploration
    initial_state: *idle
    offline_candidate:
      kind: start_analysis
      relationship: new
      candidate:
        analysis_kind: {value: exploratory, evidence: {quote: Explore}}
        fields:
          objective:
            value: Calculate budgetary impact
            evidence: {quote: budgetary impact}
          permitted_operations:
            value: [compute_program_breakdown]
            evidence: {quote: programme breakdown}
          operation_constraints:
            value: {compute_program_breakdown: {}}
            evidence: {quote: programme breakdown}
          max_model_iterations: {value: 2, evidence: {quote: Explore}}
          max_operation_calls: {value: 2, evidence: {quote: Explore}}
        outputs: [budgetary_impact]
        output_evidence: {quote: budgetary impact}
    expect:
      candidate_contains: {kind: start_analysis}
      permitted_operations: []
      response_outcome: candidate_rejected
      error_code: invalid_candidate

  - id: turn_reject_arbitrary_code_operation
    suite: turn_interpretation
    description: Arbitrary code execution cannot enter an exploratory plan.
