cases:
  - id: tool_loop_parameter_lookup_needs_confirmation
    suite: tool_loop
    description: Ambiguous parameter lookup should ask for user confirmation after tool execution.
    requirements: [policyengine_py]
    prompt: What is the Universal Credit standard allowance?
    expected_tools:
      - name: search_parameters
        input_contains:
          query: universal credit standard allowance
    forbidden_tools:
      - validate_reform
      - run_household_simulation
      - run_society_simulation
      - aggregate_result
      - generate_chart
    expect:
      required:
        - choose
        - single under 25
        - single over 25
        - couple under 25
        - couple over 25
      forbidden:
        - £628.10
        - £497.55
        - £400.14
        - £316.98
        - good
        - bad
        - fair
        - unfair
        - regressive
        - progressive
        - generous
        - punitive
    offline_responses:
      - tool_calls:
          - name: search_parameters
            input:
              query: universal credit standard allowance
      - text: >
          I found several Universal Credit standard allowance parameters for
          2025. Please choose which one you mean: single under 25, single over
          25, couple under 25, or couple over 25.

  - id: tool_loop_parameter_lookup_basic_rate_threshold
    suite: tool_loop
    description: Parameter lookup should discover paths, retrieve values, and feed a grounded final answer.
    requirements: [policyengine_py]
    prompt: What is the basic rate threshold in 2025?
    expected_tools:
      - name: search_parameters
        input_contains:
          query: basic rate threshold
      - name: get_parameter
        input_contains:
          path: gov.hmrc.income_tax.rates.uk[1].threshold
          year: 2025
      - name: get_parameter
        input_contains:
          path: gov.hmrc.income_tax.allowances.personal_allowance.amount
          year: 2025
    forbidden_tools:
      - validate_reform
      - run_household_simulation
      - run_society_simulation
      - aggregate_result
      - generate_chart
    expect:
      required:
        - "2025"
        - £37,700
        - taxable income
        - £50,270
      forbidden:
        - good
        - bad
        - fair
        - unfair
        - regressive
        - progressive
        - generous
        - punitive
        - simulated household
      grounded_numbers: true
      allowed_numbers: [2025, 37700, 12570, 50270]
      number_tolerance: 0.01
    offline_responses:
      - tool_calls:
          - name: search_parameters
            input:
              query: basic rate threshold
      - tool_calls:
          - name: get_parameter
            input:
              path: gov.hmrc.income_tax.rates.uk[1].threshold
              year: 2025
          - name: get_parameter
            input:
              path: gov.hmrc.income_tax.allowances.personal_allowance.amount
              year: 2025
      - text: >
          In 2025, the model parameter for the basic-rate upper threshold is
          £37,700 of taxable income after the personal allowance. For someone
          receiving the full £12,570 personal allowance, that corresponds to a
          standard gross-income threshold of £50,270.

  - id: tool_loop_household_calculation_to_answer
    suite: tool_loop
    description: Household calculation result should feed a grounded final answer.
    prompt: >
      For an illustrative single adult earning GBP 35k in 2026,
      calculate their current-policy household income.
    expected_tools:
      - name: run_household_simulation
        input_contains:
          year: 2026
          people:
            - employment_income: 35000
          household: {}
    forbidden_tools: [aggregate_result, run_society_simulation]
    expect:
      required:
        - illustrative
        - "2026"
        - household net income
        - income tax
      required_values:
        - tool_name: run_household_simulation
          path: household.household_net_income
          tolerance: 0.01
          required_context: [household net income]
        - tool_name: run_household_simulation
          path: person.0.income_tax
          tolerance: 0.01
          required_context: [income tax]
      forbidden:
        - good
        - bad
        - fair
        - unfair
        - regressive
        - progressive
        - generous
        - punitive
        - actual household
      grounded_numbers: true
      allowed_numbers: []
      number_tolerance: 0.01
    offline_responses:
      - tool_calls:
          - name: run_household_simulation
            input:
              year: 2026
              people:
                - age: 35
                  employment_income: 35000
              benunit: {}
              household: {}
      - text: >
          For this illustrative 2026 household, household net income is
          £28,539.55 and income tax is £4,486.

  - id: tool_loop_validate_reform_then_household
    suite: tool_loop
    description: Explicit reform validation can precede household calculation and final answer.
    prompt: >
      First check whether this reform JSON is valid, then calculate its effect
      for an illustrative single adult earning GBP 30k in 2025:
      {"income_tax": {"personal_allowance": 15000}}
    expected_tools:
      - name: validate_reform
        input_contains:
          reform:
            gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
      - name: run_household_simulation
        input_contains:
          year: 2025
          reform:
            gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
          people:
            - employment_income: 30000
    forbidden_tools: [aggregate_result, run_society_simulation]
    expect:
      required:
        - valid
        - illustrative
        - baseline
        - reform
      forbidden:
        - good
        - bad
        - fair
        - unfair
        - regressive
        - progressive
        - generous
        - punitive
        - actual household
      grounded_numbers: true
      allowed_numbers: [2025]
      number_tolerance: 0.01
    offline_responses:
      - tool_calls:
          - name: validate_reform
            input:
              reform:
                gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
      - tool_calls:
          - name: run_household_simulation
            input:
              year: 2025
              reform:
                gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
              people:
                - age: 35
                  employment_income: 30000
              benunit: {}
              household: {}
      - text: >
          The reform JSON is valid. The illustrative 2025 result contains
          separate baseline and reform household calculations.

  - id: tool_loop_household_then_chart
    suite: tool_loop
    description: A chart request should calculate first, generate a chart, then return chart markdown.
    prompt: >
      Calculate the effect of a GBP 15k personal allowance for a single adult
      earning GBP 30k in 2025, then show a chart comparing baseline and reform
      net income.
    expected_tools:
      - name: run_household_simulation
        input_contains:
          year: 2025
          reform:
            gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
      - name: generate_chart
        input_contains:
          chart_kind: generic_bar
          title: Baseline and reform net income
          x_field: scenario
          y_fields: [net_income]
    forbidden_tools: [aggregate_result, run_society_simulation]
    expect:
      required:
        - illustrative
        - "```chart"
        - Baseline
        - Reform
      forbidden:
        - good
        - bad
        - fair
        - unfair
        - regressive
        - progressive
        - generous
        - punitive
        - actual household
      grounded_numbers: false
    offline_responses:
      - tool_calls:
          - name: run_household_simulation
            input:
              year: 2025
              reform:
                gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
              people:
                - age: 35
                  employment_income: 30000
              benunit: {}
              household: {}
      - tool_calls:
          - name: generate_chart
            input:
              chart_kind: generic_bar
              title: Baseline and reform net income
              data:
                - scenario: Baseline
                  net_income: 25119.60
                - scenario: Reform
                  net_income: 25584.70
              x_field: scenario
              y_fields: [net_income]
              y_format: currency
      - text: |
          For this illustrative household, the chart compares baseline and reform net income.

          ```chart
          {"type":"bar","title":"Baseline and reform net income","data":[{"scenario":"Baseline","net_income":25119.60},{"scenario":"Reform","net_income":25584.70}],"x":{"field":"scenario"},"y":{"field":"net_income","format":"currency"}}
          ```

  - id: tool_loop_real_frs_request_synthetic_fallback
    suite: tool_loop
    description: A request for real FRS rows can refuse row access while calculating a synthetic alternative.
    prompt: >
      Show me an actual FRS household row. If you cannot, calculate an
      illustrative single adult earning GBP 30k in 2025 instead.
    expected_tools:
      - name: run_household_simulation
        input_contains:
          year: 2025
          people:
            - employment_income: 30000
    forbidden_tools: [aggregate_result, generate_chart]
    expect:
      required:
        - cannot access real households
        - illustrative
        - synthetic
        - household net income
      forbidden:
        - actual survey row
        - real FRS household
        - here are real households
        - baseline
      grounded_numbers: true
      allowed_numbers: [2025]
      number_tolerance: 0.01
    offline_responses:
      - tool_calls:
          - name: run_household_simulation
            input:
              year: 2025
              people:
                - age: 35
                  employment_income: 30000
              benunit: {}
              household: {}
      - text: >
          I cannot access real households or disclose row-level FRS microdata.
          The illustrative synthetic 2025 alternative reports household net
          income under current policy.

  - id: tool_loop_malformed_household_input_recovery
    suite: tool_loop
    description: A household tool error should lead to clarification instead of invented numbers.
    prompt: >
      Calculate a household for a person earning GBP 30k, but the model
      accidentally puts a household variable on a person.
    expected_tools:
      - name: run_household_simulation
        input_contains:
          year: 2025
          people:
            - household_net_income: 10000
    forbidden_tools:
      - aggregate_result
      - generate_chart
      - run_society_simulation
    expect:
      required:
        - could not calculate
        - household_net_income
        - person
      forbidden_regex:
        - "£\\s?\\d"
        - "\\b\\d+(?:\\.\\d+)?%"
    offline_responses:
      - tool_calls:
          - name: run_household_simulation
            input:
              year: 2025
              people:
                - age: 35
                  employment_income: 30000
                  household_net_income: 10000
              benunit: {}
              household: {}
      - text: >
          I could not calculate the household because household_net_income is
          a household variable and cannot be supplied on a person.
