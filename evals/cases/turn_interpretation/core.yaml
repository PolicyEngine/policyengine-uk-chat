    turn_id: turn-python
    initial_state: *idle
    offline_candidate:
      kind: start_analysis
      relationship: new
      candidate:
        analysis_kind: {value: exploratory, evidence: {quote: Explore}}
        fields:
          objective: {value: Run arbitrary code, evidence: {quote: Python operation}}
          permitted_operations:
            value: [python]
            evidence: {quote: Python operation}
          operation_constraints:
            value: {python: {}}
            evidence: {quote: Python operation}
          max_model_iterations: {value: 1, evidence: {quote: Explore}}
          max_operation_calls: {value: 1, evidence: {quote: Explore}}
        outputs: [budgetary_impact]
        output_evidence: {quote: Explore}
    expect:
      candidate_contains: {kind: start_analysis}
      permitted_operations: []
      response_outcome: candidate_rejected
