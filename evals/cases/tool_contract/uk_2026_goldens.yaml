  - id: uk_2026_personal_allowance_15000_reform
    suite: tool_contract
    description: Raising the personal allowance to 15000 changes a 60000 salary by 972.
    tags: [uk_2026_golden, reform]
    requirements: [policyengine_py]
    tool_name: run_household_simulation
    input:
      year: 2026
      people:
        - age: 35
          employment_income: 60000
      benunit: {}
      household:
        country: ENGLAND
      reform:
        gov.hmrc.income_tax.allowances.personal_allowance.amount: 15000
    expect:
      numeric:
        - path: baseline.person.0.income_tax
          equals: 11432
          tolerance: 0.05
        - path: reform.person.0.income_tax
          equals: 10460
          tolerance: 0.05
        - path: baseline.household.household_net_income
          equals: 45177.35546875
          tolerance: 0.05
        - path: reform.household.household_net_income
          equals: 46149.35546875
          tolerance: 0.05

