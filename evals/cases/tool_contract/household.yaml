cases:
  - id: household_couple_one_earner
    suite: tool_contract
    description: calculate_household handles a couple with one earner in one benefit unit.
    requirements: [compiled]
    tool_name: calculate_household
    input:
      year: 2025
      person:
        - person_id: 0
          benunit_id: 0
          household_id: 0
          age: 35
          employment_income: 38000
        - person_id: 1
          benunit_id: 0
          household_id: 0
          age: 35
      benunit:
        - benunit_id: 0
          household_id: 0
      household:
        - household_id: 0
    expect:
      contains:
        status: success
        person:
          - employment_income: 38000
          - employment_income: 0
      numeric:
        - path: person.0.income_tax
          equals: 4834
          tolerance: 1
        - path: person.0.employee_ni
          equals: 2034.4
          tolerance: 1
        - path: person.0.total_income
          equals: 38000
          tolerance: 0
        - path: person.1.income_tax
          equals: 0
          tolerance: 0
        - path: person.1.employee_ni
          equals: 0
          tolerance: 0
        - path: person.1.total_income
          equals: 0
          tolerance: 0
        - path: benunit.0.total_benefits
          equals: 0
          tolerance: 0
        - path: household.0.net_income
          equals: 31131.6
          tolerance: 1
        - path: household.0.total_tax
          equals: 9366
          tolerance: 1
        - path: household.0.council_tax_calculated
          equals: 1520
          tolerance: 1

  - id: household_flatmates_separate_benunits
    suite: tool_contract
    description: calculate_household preserves separate benefit units inside one household.
    requirements: [compiled]
    tool_name: calculate_household
    input:
      year: 2025
      person:
        - person_id: 0
          benunit_id: 0
          household_id: 0
          age: 35
          employment_income: 28000
        - person_id: 1
          benunit_id: 1
          household_id: 0
          age: 35
          employment_income: 20000
      benunit:
        - benunit_id: 0
          household_id: 0
        - benunit_id: 1
          household_id: 0
      household:
        - household_id: 0
    expect:
      contains:
        status: success
        person:
          - benunit_id: 0
            household_id: 0
          - benunit_id: 1
            household_id: 0
      required_paths:
        - benunit.1.total_benefits
        - household.0.net_income
      numeric:
        - path: person.0.income_tax
          equals: 3086
          tolerance: 1
        - path: person.0.employee_ni
          equals: 1234.4
          tolerance: 1
        - path: person.1.income_tax
          equals: 1486
          tolerance: 1
        - path: person.1.employee_ni
          equals: 594.4
          tolerance: 1
        - path: benunit.0.total_benefits
          equals: 0
          tolerance: 0
        - path: benunit.1.total_benefits
          equals: 0
          tolerance: 0
        - path: household.0.net_income
          equals: 41599.2
          tolerance: 1
        - path: household.0.total_tax
          equals: 9648.75
          tolerance: 1
        - path: household.0.council_tax_calculated
          equals: 1520
          tolerance: 1

