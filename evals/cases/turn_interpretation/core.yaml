  - id: turn_reject_altered_exploratory_reform
    suite: turn_interpretation
    description: Exploratory execution cannot replace the plan-approved reform.
    prompt: Explore the budget impact of setting gov.hmrc.income_tax.rates.uk[0].rate to 0.21 using one analytical call.
    turn_id: turn-altered-reform
    initial_state: *idle
    offline_candidate:
      kind: start_analysis
      relationship: new
      candidate:
        analysis_kind: {value: exploratory, evidence: {quote: Explore}}
        fields:
          reform_intent:
            value: gov.hmrc.income_tax.rates.uk[0].rate
            evidence: {quote: "gov.hmrc.income_tax.rates.uk[0].rate"}
          reform_instruction:
            value: {kind: set_exact, value: 0.21}
